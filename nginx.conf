# Increase map hash bucket size for large map values
map_hash_bucket_size 128;

# Redirect mappings from old prod site to new stage site
# Path-only format: works across all environments
map $uri $redirect_uri {
    /deploy-applications/deploy-hello-world-to-glueops /deploy-applications/deploy-first-app;
    /deploy-applications/deploy-python-app-to-glueops /deploy-applications/deploy-first-app;
    /deploy-applications/deploy-docusarus-website-to-glueops /deploy-applications/deploy-first-app;
    /deploy-applications/adding-configurations-and-secrets-to-the-hello-world-app-glueops-platform /deploy-applications/manage-environment-secrets;
    /github-token-setup /glueops-platform-administrator/configuration/creating-github-deployment-app;
    /glueops-platform-administrator/configuration/creating-github-token /glueops-platform-administrator/configuration/creating-github-deployment-app;
    /glueops-platform-administrator/configuration/adding-github-token-to-organization-secrets /glueops-platform-administrator/configuration/creating-github-deployment-app;
}

# Disable robots/SEO crawling for non-prod environments
map $host $robots_disallow {
    default "noindex, nofollow";
    docs.glueops.dev "index, follow";
}

# robots.txt content based on environment
map $host $robots_content {
    default "User-agent: *\nDisallow: /\n";
    docs.glueops.dev "User-agent: *\nAllow: /\n";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # TLS ends at the ingress, so nginx only ever sees http. Absolute redirects
    # would be built as http://, sending https visitors through a downgrade.
    # Relative Location headers keep whatever scheme the visitor used.
    absolute_redirect off;

    # Add noindex/nofollow header for non-prod environments
    add_header X-Robots-Tag $robots_disallow;

    error_page 404 /404.html;

    location = /robots.txt {
        default_type text/plain;
        return 200 $robots_content;
    }

    # With trailingSlash: false no page lives at /foo/ (only the home page is a
    # folder index). Send /foo/ to /foo so links written with a slash still land.
    location ~ ^(/.+)/$ {
        return 301 $1$is_args$args;
    }

    location / {
        # Apply explicit redirects for old prod paths
        if ($redirect_uri != "") {
            return 301 $redirect_uri;
        }

        # Docusaurus builds every route as its own HTML file. With
        # trailingSlash: false a page at /foo is foo.html, and the home page
        # and any folder index are index.html. Serve that file so each URL gets
        # its own title, description and canonical without running JavaScript.
        # A path with no page answers a real 404 with the site's 404 page.
        # $uri/ is deliberately not tried: it would 301 /foo to /foo/ whenever
        # a docs folder of that name exists, and a folder has no index.html.
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
}
